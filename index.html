<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoPoDay">
<title>PoPoDay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:#171717;background:#f5f5f3;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
#app{max-width:560px;min-height:100dvh;margin:auto;padding:22px 18px calc(100px + env(safe-area-inset-bottom));background:#f8f8f6}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:5px 0 22px}
.brand{font-size:29px;line-height:1.1;font-weight:780;letter-spacing:-1.3px}.subtitle{margin-top:5px;color:#777;font-size:12px;letter-spacing:.2px}
.page-title{font-size:27px;font-weight:760;letter-spacing:-.8px;margin:4px 0 2px}.eyebrow{font-size:11px;color:#858585;letter-spacing:.7px}
.card{background:#fff;border:1px solid #e8e8e5;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 4px 18px #00000005}
.banner{background:#ededeb;border-radius:20px;padding:17px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}
p{line-height:1.6}.muted{color:#818181}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eeeeec}.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}.row-title{font-size:14px;font-weight:650}.row-sub{font-size:12px;color:#888;margin-top:3px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px}.titleline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tag{font-size:11px;background:#f0f0ee;border-radius:99px;padding:5px 9px;color:#666;white-space:nowrap}
.progress{height:7px;background:#dededb;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#222;border-radius:99px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.metric{background:#f3f3f1;border-radius:16px;padding:13px}.metric strong{font-size:19px;display:block}.metric span{font-size:12px;color:#777}
.primary{background:#171717;color:#fff;border:1px solid #171717;border-radius:14px;padding:12px 16px;font-weight:650}
.secondary{background:#fff;color:#222;border:1px solid #dededb;border-radius:13px;padding:9px 12px}
.ghost{border:0;background:transparent;color:#555;padding:7px 4px}
.full{width:100%}.pill{border:1px solid #e1e1de;border-radius:99px;background:#fff;padding:7px 11px;font-size:12px;color:#555}
.pill.active{background:#171717;color:#fff;border-color:#171717}
.tabs{display:flex;background:#eeeeec;border-radius:99px;padding:3px;gap:3px;margin-bottom:15px}
.tabs button{flex:1;border:0;background:transparent;border-radius:99px;padding:8px 4px;color:#666;font-size:12px}
.tabs button.active{background:#171717;color:#fff}
.check{width:21px;height:21px;accent-color:#171717;flex-shrink:0}
.task-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #eee}.task-row:last-child{border:0}
.task-row.done .row-title{text-decoration:line-through;color:#999}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week button{border:1px solid #e7e7e4;border-radius:12px;background:white;padding:9px 2px;font-size:12px;color:#666}.week button.active{background:#171717;color:#fff;border-color:#171717}
.section{font-size:15px;font-weight:700;margin:18px 0 8px}.notice{background:#f0f0ed;border-radius:14px;padding:12px;color:#666;font-size:12px;line-height:1.65}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.workout-card{background:#f1f1ef;border-radius:17px;padding:15px;min-height:110px;border:1px solid transparent;text-align:left;color:#171717}
.workout-card.selected{border-color:#171717;background:#e8e8e5}
.workout-card b{font-size:22px}.workout-card p{font-size:14px;margin:8px 0}.workout-card small{color:#777}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.linkrow:last-child{border:0}
.link{color:#171717;text-decoration:underline;text-underline-offset:3px;font-size:13px;white-space:nowrap}
.field{width:100%;border:1px solid #dededb;background:#fff;border-radius:12px;padding:12px;color:#171717;outline:none}
.field:focus{border-color:#777}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formlabel{display:block;font-size:12px;color:#666;margin:0 0 6px}
.formgroup{margin:10px 0}.actions{display:flex;gap:8px}.actions>*{flex:1}
.expense{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.expense:last-child{border:0}
.expense-dot{width:34px;height:34px;border-radius:11px;background:#f0f0ee;display:grid;place-items:center;font-size:14px}
.money{font-size:26px;font-weight:760;letter-spacing:-.7px}.bar-row{display:grid;grid-template-columns:60px 1fr 65px;align-items:center;gap:8px;margin:11px 0;font-size:12px}.bar{height:7px;background:#eee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#333;border-radius:99px}
.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;justify-content:space-around;padding:9px 3px max(12px,env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid #e7e7e4}
.nav button{border:0;background:transparent;color:#888;font-size:11px;min-width:55px;padding:2px}.nav button.active{color:#171717;font-weight:750}.nav .ico{font-size:20px;display:block;margin-bottom:3px;line-height:1.2}
.empty{text-align:center;padding:22px 8px;color:#999;font-size:13px}
.modalback{position:fixed;inset:0;background:#0006;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal{width:min(540px,100%);background:#fff;border-radius:22px;padding:20px;max-height:88dvh;overflow:auto}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:white;padding:10px 15px;border-radius:99px;font-size:12px;z-index:20}
@media(min-width:700px){body{background:#e9e9e6}#app{box-shadow:0 0 50px #0000000a;min-height:100vh}}
</style>
</head>
<body>
<main id="app"></main><nav class="nav" id="nav"></nav><div id="modal-root"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const days=['周日','周一','周二','周三','周四','周五','周六'];
const seed={
 tasks:[
  {id:1,name:'遛狗散步',detail:'晚上 · 60–120分钟',day:'每天',done:false,category:'陪伴'},
  {id:2,name:'力量训练 A',detail:'20–25分钟 · 上肢与核心',day:'周一',done:false,category:'训练'},
  {id:3,name:'力量训练 B',detail:'20–25分钟 · 臀腿与核心',day:'周三',done:false,category:'训练'},
  {id:4,name:'周末健身房',detail:'有氧爬坡 · 30–45分钟',day:'周六',done:false,category:'训练'},
  {id:5,name:'周末采购与备餐',detail:'周六或周日 · 灵活安排',day:'周日',done:false,category:'生活'}
 ],
 expenses:[], workouts:[], jobs:[], notes:{}, xp:0, weekend:'少量接单',
 gym:{budget:150,orientation:true}, lastBackup:''
};
const clone=x=>JSON.parse(JSON.stringify(x));
let data;try{data=JSON.parse(localStorage.getItem('popoday-v1'))||clone(seed)}catch(e){data=clone(seed)}
for(const k in seed)if(data[k]===undefined)data[k]=clone(seed[k]);
if(!Array.isArray(data.expenses))data.expenses=[];
if(!Array.isArray(data.workouts))data.workouts=[];
// Remove old diary-only task while retaining all other user-created tasks and history.
data.tasks=(data.tasks||clone(seed.tasks)).filter(t=>!/日记|日誌/.test(t.name||''));
data.tasks=data.tasks.map(t=>({...t,done:!!t.done}));
if(data.taskDate!==today()){data.tasks.forEach(t=>t.done=false);data.taskDate=today()}
function save(){try{localStorage.setItem('popoday-v1',JSON.stringify(data))}catch(e){toast('本机存储空间不足，请先导出备份')}}
let page='home',selectedDay=new Date().getDay(),planRange='本周',workoutType='A',editingExpense=null,financeRange='本月';
function toast(s){let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.appendChild(el);setTimeout(()=>el.remove(),1900)}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function header(title,caption=''){return `<header class="top"><div><div class="page-title">${title}</div><div class="eyebrow">${caption}</div></div></header>`}
function card(s){return `<section class="card">${s}</section>`}
function button(label,action,cls='primary'){return `<button class="${cls}" onclick="${action}">${label}</button>`}
function taskRow(t){return `<div class="task-row ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id},this.checked)"><div class="grow"><div class="row-title">${esc(t.name)}</div><div class="row-sub">${esc(t.detail||'')}</div></div><button class="ghost" onclick="editTask(${t.id})">···</button></div>`}
function toggleTask(id,v){let t=data.tasks.find(x=>x.id===id);if(!t)return;t.done=v;data.xp=Math.max(0,data.xp+(v?10:-10));save();render()}
function doneCount(){return data.tasks.filter(t=>t.done).length}
function home(){
 const d=new Date(),daily=data.tasks.filter(t=>t.day==='每天'||t.day===days[d.getDay()]);
 return `<div class="top"><div><div class="brand">PoPoDay ✦</div><div class="subtitle">生活 · 训练 · 计划 · 财务</div></div><div class="eyebrow">${d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',weekday:'long'})}</div></div>
 <div class="banner"><div class="small muted">TODAY · KEEP A GOOD RHYTHM</div><div class="line" style="margin-top:9px"><div><div style="font-size:24px;font-weight:760">Lv.${Math.floor(data.xp/200)+1}</div><div class="small muted">${data.xp%200} / 200 XP</div></div><div style="font-size:12px;color:#666">${doneCount()} 项已完成</div></div><div class="progress"><div style="width:${data.xp%200/2}%"></div></div></div>
 ${card(`<div class="titleline"><h2 style="margin:0">今日任务</h2><span class="tag">${daily.filter(t=>t.done).length}/${daily.length} 完成</span></div>${daily.map(taskRow).join('')||'<div class="empty">今天没有安排，留一点自由时间。</div>'}<button class="secondary full" style="margin-top:12px" onclick="go('plan')">查看完整计划　→</button>`)}
 ${card(`<div class="titleline"><h2 style="margin:0">本周节奏</h2><span class="small muted">目标 · 训练 3 次</span></div><div class="metric-grid"><div class="metric"><strong>${data.workouts.filter(x=>weekKey(x.date)===weekKey(today())).length}/3</strong><span>本周训练</span></div><div class="metric"><strong>¥${monthExpense().toFixed(0)}</strong><span>本月已记录支出</span></div></div>`)}
 ${card(`<div class="titleline"><h2 style="margin:0">快捷入口</h2></div><div class="grid2"><button class="workout-card" onclick="go('training')"><b>↗</b><p>训练计划</p><small>居家跟练 / 周末有氧</small></button><button class="workout-card" onclick="go('finance')"><b>＋</b><p>记一笔支出</p><small>物品 · 金额 · 分类</small></button></div>`)}
 `
}
function weekKey(dateStr){let d=new Date(dateStr+'T12:00:00');let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toLocaleDateString('sv-SE')}
function monthExpense(){let m=today().slice(0,7);return data.expenses.filter(x=>(x.date||'').startsWith(m)).reduce((s,x)=>s+Number(x.amount||0),0)}
function plan(){
 let current=days[selectedDay],items=data.tasks.filter(t=>t.day==='每天'||t.day===current);
 return header('计划','PLAN · 每日安排与每周节奏')+card(`<div class="tabs">${['本日','本周','本月'].map(x=>`<button class="${planRange===x?'active':''}" onclick="planRange='${x}';render()">${x}</button>`).join('')}</div>
 ${planRange==='本日'?`<div class="line"><button class="ghost" onclick="selectedDay=(selectedDay+6)%7;render()">‹</button><b>${current} · ${selectedDay===new Date().getDay()?'今天':'每周安排'}</b><button class="ghost" onclick="selectedDay=(selectedDay+1)%7;render()">›</button></div><div style="margin-top:10px">${items.map(taskRow).join('')||'<div class="empty">暂无安排</div>'}</div>`:
 planRange==='本周'?`<div class="week">${days.map((d,i)=>`<button class="${selectedDay===i?'active':''}" onclick="selectedDay=${i};render()">${d.slice(1)}</button>`).join('')}</div><div class="section">${current} · 任务</div>${items.map(taskRow).join('')||'<div class="empty">暂无安排</div>'}`:
 `<div class="metric-grid"><div class="metric"><strong>3 次</strong><span>每周训练目标</span></div><div class="metric"><strong>¥${data.gym.budget}</strong><span>健身房月预算上限</span></div></div><p class="small muted">工作日以居家训练为主；周末安排健身房有氧，按接单情况灵活调整。</p>`}
 <div class="actions" style="margin-top:14px"><button class="secondary full" onclick="addTask()">＋ 添加安排</button></div>`)+card(`<h3>周末安排</h3><div class="tabs">${['无接单','少量接单','赶稿中'].map(x=>`<button class="${data.weekend===x?'active':''}" onclick="data.weekend='${x}';save();render()">${x}</button>`).join('')}</div><div class="notice">${data.weekend==='赶稿中'?'优先保留交稿时间，训练缩短为可选轻量版本。':data.weekend==='少量接单'?'建议周末上午先完成健身房训练，下午采购或处理接单。':'周末上午训练，其余时间安排采购、休息。'}</div>`)
}
function addTask(){modal(`<div class="modalhead"><h2>新增计划</h2><button class="ghost" onclick="closeModal()">关闭</button></div><form onsubmit="submitTask(event)"><div class="formgroup"><label class="formlabel">任务名称</label><input class="field" name="name" required placeholder="例如：遛狗散步"></div><div class="formgroup"><label class="formlabel">补充说明</label><input class="field" name="detail" placeholder="时长 / 内容"></div><div class="formgroup"><label class="formlabel">安排日期</label><select class="field" name="day">${['每天',...days.slice(1),'周日'].filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<option>${x}</option>`) .join('')}</select></div><button class="primary full" type="submit">保存计划</button></form>`)}
function submitTask(e){e.preventDefault();let f=new FormData(e.target);data.tasks.push({id:Date.now(),name:f.get('name'),detail:f.get('detail'),day:f.get('day'),done:false});save();closeModal();render()}
function editTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;modal(`<div class="modalhead"><h2>编辑计划</h2><button class="ghost" onclick="closeModal()">关闭</button></div><form onsubmit="updateTask(event,${id})"><div class="formgroup"><label class="formlabel">任务名称</label><input class="field" name="name" required value="${esc(t.name)}"></div><div class="formgroup"><label class="formlabel">补充说明</label><input class="field" name="detail" value="${esc(t.detail)}"></div><div class="formgroup"><label class="formlabel">安排日期</label><select class="field" name="day">${['每天',...days.slice(1)].map(x=>`<option ${x===t.day?'selected':''}>${x}</option>`).join('')}</select></div><div class="actions"><button class="primary" type="submit">保存修改</button><button class="secondary" type="button" onclick="deleteTask(${id})">删除</button></div></form>`)}
function updateTask(e,id){e.preventDefault();let t=data.tasks.find(x=>x.id===id),f=new FormData(e.target);Object.assign(t,{name:f.get('name'),detail:f.get('detail'),day:f.get('day')});save();closeModal();render()}
function deleteTask(id){if(!confirm('确定删除这条计划吗？'))return;data.tasks=data.tasks.filter(t=>t.id!==id);save();closeModal();render()}
const workouts={
 A:{title:'上肢 + 核心',duration:'20–25 分钟',moves:[['靠墙 / 斜板俯卧撑','2 组 × 8–12 次'],['背包划船','2 组 × 10–12 次'],['鸟狗式','2 组 × 每侧 8 次'],['死虫式','2 组 × 每侧 8 次']]},
 B:{title:'臀腿 + 核心',duration:'20–25 分钟',moves:[['椅子深蹲','2 组 × 10–12 次'],['臀桥','2 组 × 12 次'],['髋关节折叠练习','2 组 × 10 次'],['侧卧抬腿','2 组 × 每侧 10 次']]},
 C:{title:'全身力量',duration:'30 分钟',moves:[['徒手深蹲','2 组 × 10 次'],['斜板俯卧撑','2 组 × 8–10 次'],['背包划船','2 组 × 10 次'],['鸟狗式','2 组 × 每侧 8 次']]}
};
function training(){
 let w=workouts[workoutType],count=data.workouts.filter(x=>weekKey(x.date)===weekKey(today())).length;
 return header('训练','FITNESS · 工作日居家 / 周末健身房')+
 card(`<div class="titleline"><h2 style="margin:0">本周训练目标</h2><span class="tag">${Math.min(count,3)} / 3 次</span></div><div class="progress"><div style="width:${Math.min(count/3*100,100)}%"></div></div><p class="small muted">工作日：B 站居家跟练；周末：健身房有氧、跑步机爬坡。</p>`)+
 card(`<h3>工作日 · 居家力量训练</h3><div class="grid2">${Object.entries(workouts).map(([k,v])=>`<button class="workout-card ${workoutType===k?'selected':''}" onclick="workoutType='${k}';render()"><b>${k}</b><p>${v.title}</p><small>${v.duration}</small></button>`).join('')}</div><div class="section">训练 ${workoutType} · 动作参考</div>${w.moves.map((x,i)=>`<div class="row"><div class="grow"><div class="row-title">${i+1}. ${x[0]}</div><div class="row-sub">${x[1]}</div></div></div>`).join('')}<div class="section">B 站跟练入口</div><div class="linkrow"><div><b>${w.title} · 新手入门</b><div class="row-sub">选择无器械、低冲击、动作讲解清楚的视频</div></div><a class="link" target="_blank" rel="noopener" href="https://search.bilibili.com/all?keyword=${encodeURIComponent('无器械 '+w.title+' 新手 20分钟 跟练')}">打开 ↗</a></div><button class="primary full" style="margin-top:14px" onclick="recordWorkout('居家 '+workoutType)">完成并记录训练</button>`)+
 card(`<h3>周末 · 健身房有氧</h3><div class="row"><div class="grow"><b>跑步机爬坡入门</b><div class="row-sub">先从 15–25 分钟开始，速度舒适、能完整说话</div></div><span class="tag">低冲击</span></div><div class="row"><div class="grow"><b>椭圆机 / 自行车</b><div class="row-sub">器械不熟悉时可先选操作简单的设备</div></div><span class="tag">备选</span></div><div class="notice">第一次到店：可以请教练带你熟悉器械、调整跑步机坡度与速度；不需要一开始购买私教课。月预算上限 ¥150，先确认是否有月卡、次卡或新客体验价。</div><div class="linkrow"><div><b>健身房选择</b><div class="row-sub">预算 ≤ ¥150 / 月 · 首次可接受教练带熟器械</div></div><button class="secondary" onclick="toast('需要你的居住地址或附近地标，才能准确筛选门店')">待补地址</button></div><button class="primary full" onclick="recordWorkout('健身房有氧')">完成并记录有氧</button>`)
}
function recordWorkout(type){data.workouts.push({id:Date.now(),date:today(),type});data.xp+=20;save();toast('训练已记录');render()}
const categories=['餐饮','购物','交通','宠物','居家','娱乐','医疗','其他'];
function finance(){
 let period=financeRange==='本月'?today().slice(0,7):today().slice(0,4);
 let items=data.expenses.filter(x=>(x.date||'').startsWith(period)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 let total=items.reduce((s,x)=>s+Number(x.amount||0),0),groups={};items.forEach(x=>groups[x.category||'其他']=(groups[x.category||'其他']||0)+Number(x.amount||0));
 let max=Math.max(1,...Object.values(groups));
 return header('财务','FINANCE · 记账与支出分析')+
 card(`<div class="tabs">${['本月','年度'].map(x=>`<button class="${financeRange===x?'active':''}" onclick="financeRange='${x}';render()">${x}</button>`).join('')}</div><div class="small muted">${financeRange}支出 · ${period}</div><div class="money" style="margin:4px 0 15px">¥${total.toFixed(2)}</div>${Object.keys(groups).length?Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar-row"><span>${k}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b class="right">¥${v.toFixed(2)}</b></div>`).join(''):'<div class="empty">这段时间还没有支出，记下第一笔吧。</div>'}<button class="primary full" style="margin-top:12px" onclick="openExpenseForm()">＋ 记一笔</button>`)+
 card(`<div class="titleline"><h3 style="margin:0">${financeRange==='本月'?'本月记录':'年度记录'}</h3><span class="small muted">${items.length} 笔</span></div>${items.length?items.map(expenseRow).join(''):'<div class="empty">暂无记录</div>'}`)
}
function expenseRow(x){return `<div class="expense"><div class="expense-dot">${({'餐饮':'餐','购物':'购','交通':'行','宠物':'爪','居家':'家','娱乐':'娱','医疗':'医','其他':'·'})[x.category||'其他']||'·'}</div><div class="grow"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${esc(x.date||today())} · ${esc(x.category||'其他')}</div></div><b>¥${Number(x.amount||0).toFixed(2)}</b><button class="ghost" onclick="openExpenseForm(${x.id})">编辑</button></div>`}
function openExpenseForm(id=null){
 editingExpense=id;let x=id?data.expenses.find(a=>a.id===id):null;
 modal(`<div class="modalhead"><h2>${x?'编辑支出':'记一笔支出'}</h2><button class="ghost" onclick="closeModal()">关闭</button></div>
 <form onsubmit="saveExpense(event,${id??'null'})">
 <div class="formgroup"><label class="formlabel">物品 / 支出名称</label><input class="field" name="name" required maxlength="60" placeholder="例如：咖啡、地铁、狗粮" value="${esc(x?.name||'')}"></div>
 <div class="formgroup"><label class="formlabel">金额（元）</label><input class="field" name="amount" required type="number" min="0.01" step="0.01" placeholder="0.00" value="${x?Number(x.amount).toFixed(2):''}"></div>
 <div class="formgrid"><div class="formgroup"><label class="formlabel">分类</label><select class="field" name="category">${categories.map(c=>`<option ${c===(x?.category||'餐饮')?'selected':''}>${c}</option>`).join('')}</select></div><div class="formgroup"><label class="formlabel">日期</label><input class="field" type="date" name="date" value="${x?.date||today()}" required></div></div>
 <div class="actions"><button class="primary" type="submit">保存</button>${x?`<button class="secondary" type="button" onclick="deleteExpense(${id})">删除这笔</button>`:''}</div>
 </form>`)
}
function saveExpense(e,id){e.preventDefault();let f=new FormData(e.target),record={name:f.get('name').trim(),amount:Number(f.get('amount')),category:f.get('category'),date:f.get('date')};if(!record.name||!Number.isFinite(record.amount)||record.amount<=0){toast('请检查名称和金额');return}if(id){let x=data.expenses.find(a=>a.id===id);Object.assign(x,record)}else data.expenses.push({id:Date.now(),...record});save();closeModal();render();toast('支出已保存')}
function deleteExpense(id){if(!confirm('确定删除这笔支出吗？删除后无法恢复。'))return;data.expenses=data.expenses.filter(x=>x.id!==id);save();closeModal();render();toast('已删除')}
function profile(){
 return header('我的','PROFILE · 数据与偏好')+
 card(`<div class="line"><div><b>PoPoDay</b><div class="row-sub">个人生活管理 · Lv.${Math.floor(data.xp/200)+1}</div></div><span class="tag">V1.2</span></div>`)+
 card(`<h3>训练偏好</h3><div class="row"><div class="grow">健身房月预算上限</div><b>¥${data.gym.budget}</b></div><div class="row"><div class="grow">首次到店</div><span class="small muted">可接受教练带熟器械</span></div><div class="row"><div class="grow">训练方式</div><span class="small muted">工作日居家 / 周末健身房</span></div>`)+
 card(`<h3>数据管理</h3><p class="small muted">记录保存在当前浏览器。建议定期导出备份；更换设备或浏览器不会自动同步。</p><button class="primary full" onclick="exportData()">导出数据备份</button><label class="secondary full" style="display:block;text-align:center;margin-top:9px">导入备份<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label><div class="tiny muted" style="margin-top:9px">上次导出：${esc(data.lastBackup||'尚未导出')}</div>`)
}
function modal(content){$('#modal-root').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){$('#modal-root').innerHTML=''}
function exportData(){data.lastBackup=today();save();let blob=new Blob([JSON.stringify({app:'PoPoDay',version:1.2,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='PoPoDay-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);render()}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),incoming=x.data||x;if(!Array.isArray(incoming.expenses)||!Array.isArray(incoming.tasks))throw Error('备份格式不正确');if(!confirm('导入会覆盖当前 PoPoDay 数据，确定继续吗？'))return;data={...clone(seed),...incoming};data.tasks=data.tasks.filter(t=>!(/日记|日誌/.test(t.name||'')));save();render();toast('备份已恢复')}catch(err){alert('导入失败：'+err.message)}};r.readAsText(f)}
const navItems=[['home','⌂','首页'],['plan','▦','计划'],['training','♧','训练'],['finance','▣','财务'],['profile','◉','我的']];
function render(){let views={home,plan,training,finance,profile};$('#app').innerHTML=(views[page]||home)();$('#nav').innerHTML=navItems.map(([k,ico,label])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${ico}</span>${label}</button>`).join('')}
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
