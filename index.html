<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ed"><title>PoPoDay</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#29251f;background:#f6f2ec}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}#app{max-width:540px;margin:auto;min-height:100dvh;padding:18px 17px 98px;background:linear-gradient(160deg,#faf7f2,#f1ebe3)}.top{display:flex;justify-content:space-between;align-items:center;margin:12px 0 18px}.brand{font-size:29px;font-weight:850;letter-spacing:-1.5px}.sub{color:#887f75;font-size:12px}.h{font-size:24px;font-weight:800;margin:5px 0 15px}.card{background:#fffdf9;border:1px solid #e9e1d9;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 6px 22px #493c2a09}.soft{background:#f0e8de}.muted{color:#8b8176}.small{font-size:12px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee9e3}.row:last-child{border:0}.row .grow{flex:1}.pill{border:1px solid #e6ddd4;border-radius:999px;padding:8px 12px;background:#fffdf9;color:#554c43}.pill.active,.primary{background:#40382f;color:white;border-color:#40382f}.primary{border:0;border-radius:18px;padding:13px 16px;font-weight:650}.secondary{border:1px solid #ded6cd;border-radius:15px;background:transparent;padding:11px 14px;color:#443d35}.full{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#fffcf8f2;backdrop-filter:blur(14px);border-top:1px solid #e9e2d8;display:flex;justify-content:space-around;padding:10px 2px max(12px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#857b70;font-size:11px;min-width:55px}.nav button.active{color:#29251f;font-weight:800}.nav i{display:block;font-size:22px;font-style:normal;margin-bottom:3px}.progress{height:9px;background:#e9e1d9;border-radius:30px;overflow:hidden}.progress>div{height:100%;background:#746658;border-radius:30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f5efe8;border-radius:16px;padding:14px}.metric b{font-size:22px}.chipset{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.section{font-weight:800;font-size:16px;margin:18px 0 9px}.field{width:100%;border:1px solid #e4dcd2;border-radius:13px;padding:12px;background:#fffdf9;color:#29251f}.textarea{min-height:90px;resize:vertical}.check{width:22px;height:22px;accent-color:#4c443a;flex-shrink:0}.tag{font-size:11px;background:#eee5db;border-radius:12px;padding:5px 8px;color:#6b5e50}.banner{background:linear-gradient(120deg,#e7d8c8,#f8f2ea);border-radius:22px;padding:18px}.mascot{font-size:29px;letter-spacing:-8px;margin-right:10px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.menu button{background:#fffdf9;border:1px solid #e8e0d6;border-radius:16px;padding:15px 5px;color:#433b32;font-size:12px}.menu span{display:block;font-size:24px;margin-bottom:6px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tabs button{white-space:nowrap}.money{font-weight:750}.danger{color:#a04f41}.spaced{margin-top:14px}.notice{background:#f3e7d9;border-radius:14px;padding:12px;font-size:12px;color:#665646;line-height:1.7}.empty{padding:20px;text-align:center;color:#8b8176}.titleline{display:flex;align-items:center;justify-content:space-between;gap:10px}p{line-height:1.65}.tiny{font-size:11px}.navlink{border:0;background:transparent;text-align:left;color:inherit;padding:0}.imagebox{height:78px;width:85px;border-radius:15px;background:#ede2d5;display:grid;place-items:center;font-size:36px}.week{display:flex;gap:6px;justify-content:space-between}.week button{flex:1;min-width:0;padding:10px 3px;border-radius:12px;border:1px solid #e8ded4;background:white}.week button.active{background:#40382f;color:white}.right{text-align:right}input[type=number]{max-width:100%} @media(min-width:700px){body{background:#e8e2da}#app{box-shadow:0 0 60px #2e25191a}}
</style></head><body><main id="app"><div class="top"><div><div class="brand">PoPoDay ✦</div><div class="sub">生活 · 训练 · 饮食 · 工作 · 陪伴</div></div><span class="mascot">🐕‍🦺 🐈‍⬛</span></div><section class="card"><h2>今日任务</h2><p>🐾 遛狗散步 · 晚上60–120分钟</p><p>🏋️ 力量训练 · 每周3次</p><p>🥣 周末采购与备餐</p><p>📖 今日日记</p></section><section class="card"><h3>PoPoDay 手机预览</h3><p>若这里一直只显示静态内容，说明当前文件预览不支持运行网页脚本。请通过网站链接打开部署后的版本。</p></section></main><nav class="nav" id="nav"></nav><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={tasks:[{id:1,name:'遛狗散步',detail:'晚上 · 60–120分钟',day:'每天',done:false,category:'陪伴'},{id:2,name:'力量训练 A',detail:'20–25分钟 · 上肢与核心',day:'周一',done:false,category:'训练'},{id:3,name:'力量训练 B',detail:'20–25分钟 · 臀腿与核心',day:'周三',done:false,category:'训练'},{id:4,name:'周末上午力量训练',detail:'30分钟 · 根据接单调整',day:'周六',done:false,category:'训练'},{id:5,name:'周末采购与备餐',detail:'周六或周日 · 灵活安排',day:'周日',done:false,category:'饮食'},{id:6,name:'今日简短日记',detail:'3分钟',day:'每天',done:false,category:'生活'}],groceries:[{id:1,name:'鸡胸肉',qty:1,unit:'kg',price:19.9,checked:false},{id:2,name:'鸡蛋',qty:10,unit:'个',price:0.79,checked:false},{id:3,name:'西兰花',qty:0.5,unit:'kg',price:19.8,checked:false},{id:4,name:'番茄',qty:0.5,unit:'kg',price:13.8,checked:false},{id:5,name:'牛肉',qty:0.3,unit:'kg',price:96,checked:false},{id:6,name:'米饭/大米',qty:1,unit:'份',price:8.9,checked:false},{id:7,name:'豆腐',qty:2,unit:'盒',price:3,checked:false}],diaries:{},expenses:[],jobs:[],notes:{},reviews:[],meals:{},xp:0,prep:[false,false,false,false],settings:{store:'小象超市',coffeePrice:15.77},workouts:[],weekend:'少量接单',lastBackup:''};
const clone=x=>JSON.parse(JSON.stringify(x));let data;try{data=JSON.parse(localStorage.getItem('popoday-v1'))||clone(seed)}catch(e){data=clone(seed)}for(let k in seed)if(data[k]===undefined)data[k]=clone(seed[k]);let page='home',sub='',selectedDay=new Date().getDay(),activeTask=null;const days=['周日','周一','周二','周三','周四','周五','周六'];const today=()=>new Date().toLocaleDateString('sv-SE');if(data.taskDate!==today()){if(data.taskDate){data.taskHistory=data.taskHistory||[];data.taskHistory.push({date:data.taskDate,tasks:data.tasks.map(t=>({id:t.id,name:t.name,done:t.done}))})}data.tasks.forEach(t=>t.done=false);data.taskDate=today();try{localStorage.setItem('popoday-v1',JSON.stringify(data))}catch(e){}}function save(){try{localStorage.setItem('popoday-v1',JSON.stringify(data))}catch(e){console.warn('无法保存到本地浏览器',e)}}function go(p,s=''){page=p;sub=s;render();scrollTo(0,0)}function header(title,caption=''){return `<div class="top"><div><div class="brand">${title}</div>${caption?`<div class="sub">${caption}</div>`:''}</div><span class="mascot">🐕‍🦺 🐈‍⬛</span></div>`}function card(s){return `<section class="card">${s}</section>`}function btn(label,action=''){return `<button class="primary full" onclick="${action}">${label}</button>`}function row(name,detail='',action='',left='◻'){return `<div class="row"><span style="font-size:22px">${left}</span><div class="grow"><b>${esc(name)}</b><div class="small muted">${esc(detail)}</div></div>${action?`<button class="secondary" onclick="${action}">查看</button>`:''}</div>`}function doneCount(){return data.tasks.filter(x=>x.done).length}function taskItem(t){return `<div class="row"><input class="check" aria-label="完成${esc(t.name)}" type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id},this.checked)"><div class="grow"><b style="${t.done?'text-decoration:line-through;color:#9c9185':''}">${esc(t.name)}</b><div class="small muted">${esc(t.detail)}</div></div><button class="pill" onclick="reviewTask(${t.id})">${t.done?'记录':'备注'}</button></div>`}function toggleTask(id,checked){let t=data.tasks.find(x=>x.id===id);t.done=checked;if(checked)data.xp+=10;else data.xp=Math.max(0,data.xp-10);save();render()}function reviewTask(id){activeTask=id;go('review')}
function home(){return header('PoPoDay ✦','生活 · 训练 · 饮食 · 工作 · 陪伴')+`<div class="banner"><div class="small">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</div><div class="line spaced"><div><div class="h">Lv.${Math.floor(data.xp/200)+1}</div><div class="small muted">${data.xp%200} / 200 XP</div></div><span class="mascot" style="font-size:44px">🐕‍🦺 🐈‍⬛</span></div><div class="progress"><div style="width:${data.xp%200/2}%"></div></div></div>`+card(`<div class="titleline"><b>今日状态</b><span class="tag">轻量管理</span></div><div class="grid spaced">${[['⚡','精力','按状态调整'],['☾','睡眠','逐步规律'],['♧','运动','每周3次'],['♡','饮食','正常吃饭']].map(x=>`<div class="metric"><span>${x[0]} ${x[1]}</span><div class="small muted">${x[2]}</div></div>`).join('')}</div>`)+card(`<div class="titleline"><b>今日任务</b><span class="tag">${doneCount()}/${data.tasks.length} 已完成</span></div>${data.tasks.slice(0,5).map(taskItem).join('')}<button class="secondary full spaced" onclick="go('plan')">查看本周计划</button>`)+card(`<b>快捷入口</b><div class="menu spaced">${[['🥣','备餐','prep'],['📖','日记','diary'],['✨','GPT分析','review'],['💰','财务','finance'],['💼','接单','work'],['📈','成长','growth']].map(x=>`<button onclick="go('${x[2]}')"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div>`)}
function plan(){return header('本周计划','根据工作、遛狗和周末接单灵活调整')+card(`<div class="week">${days.map((d,i)=>`<button class="${selectedDay===i?'active':''}" onclick="selectedDay=${i};render()">${d.replace('周','')}</button>`).join('')}</div><div class="section">${days[selectedDay]} · 任务</div>${data.tasks.filter(t=>t.day==='每天'||t.day===days[selectedDay]).map(taskItem).join('')||'<div class="empty">今天没有固定任务</div>'}`)+card(`<b>周末状态</b><div class="chipset">${['无接单','少量接单','赶稿中'].map(x=>`<button class="pill ${data.weekend===x?'active':''}" onclick="data.weekend='${x}';save();render()">${x}</button>`).join('')}</div><div class="notice">${data.weekend==='赶稿中'?'优先预留交稿时间，训练改成可选短时版本；备餐可移至另一日。':data.weekend==='少量接单'?'优先安排周末上午训练，预留接单时段；采购和备餐可周六、周日互换。':'周末上午优先训练，其余时间安排采购、备餐和休息。'}</div>`)+card(btn('＋ 新增任务',"addTask()"))}function addTask(){let name=prompt('任务名称');if(!name)return;let day=prompt('安排在哪一天？输入 周一～周日 或 每天','每天')||'每天';data.tasks.push({id:Date.now(),name,detail:'自定义任务',day,done:false,category:'生活'});save();render()}
function training(){return header('训练','FITNESS · 居家起步 / 周末可去健身房')+card(`<div class="titleline"><b>本周训练</b><span class="tag">${data.workouts.length} 次记录</span></div><div class="grid spaced"><div class="metric"><b>A</b><p>上肢 + 核心</p><span class="small">20–25分钟</span></div><div class="metric"><b>B</b><p>臀腿 + 核心</p><span class="small">20–25分钟</span></div><div class="metric"><b>C</b><p>全身力量</p><span class="small">周末上午优先</span></div><div class="metric"><b>恢复</b><p>遛狗 + 休息</p><span class="small">不补偿性加练</span></div></div>`)+card(`<b>训练 A · 动作参考</b>${[['靠墙/斜板俯卧撑','2组 × 8–12次'],['背包划船','2组 × 10–12次'],['鸟狗式','2组 × 每侧8次'],['死虫式','2组 × 每侧8次']].map(x=>row(x[0],x[1],'','🏋️')).join('')}<div class="notice">先掌握动作，逐渐增加难度。服用米诺环素期间若头晕或不适，请停止训练并咨询医生。</div><div class="section">B站跟练入口 · 点击搜索对应课程</div>${[['A 上肢+核心 · 20分钟','无器械 上肢 核心 新手 20分钟'],['B 臀腿+核心 · 20分钟','无器械 臀腿 核心 新手 20分钟'],['C 全身力量 · 30分钟','全身力量 无器械 新手 30分钟']].map(x=>`<div class="row"><div class="grow"><b>${x[0]}</b><div class="small muted">B站搜索结果，可自行选适合的视频</div></div><a class="secondary" target="_blank" rel="noopener" href="https://search.bilibili.com/all?keyword=${encodeURIComponent(x[1])}">打开 ↗</a></div>`).join('')}<div class="spaced">${btn('✓ 记录一次训练',"data.workouts.push({date:today(),type:'力量训练'});data.xp+=20;save();render();alert('已记录训练')")}</div>`)}
const dishes=[['🌯','鸡胸肉鸡蛋卷饼','熟鸡胸肉、鸡蛋、全麦饼皮；可加辣'],['🍳','鸡肉蔬菜蛋杯','鸡蛋、熟鸡肉、彩椒；周末预制'],['🥪','鸡肉芝士三明治','全麦吐司、熟鸡肉、芝士'],['🍚','香辣鸡胸肉饭','鸡胸肉、米饭、西兰花、辣椒粉'],['🍲','番茄牛肉豆腐锅','牛肉、番茄、豆腐；不放香菜芹菜']];function nutrition(){return header('饮食','NUTRITION · 增肌塑形 / 不节食')+card(`<b>今天吃什么</b>${[['早餐','罗森肉包 + 热豆浆','约0分钟备餐'],['咖啡','瑞幸精萃澳瑞白 · 热 · 大杯 · 燕麦奶','不另外加糖 · 截图价 ¥15.77'],['午餐','周末预制餐 / 外卖灵活替换','优先蛋白质 + 主食 + 蔬菜'],['晚餐','简易组合餐 / 外卖','遛狗前后按实际时间安排']].map(x=>row(x[0],x[1]+' · '+x[2],'','🥢')).join('')}<div class="spaced">${btn('✓ 记录今天的澳白（同时记账）',"coffee()")}</div>`)+card(`<b>饮食功能</b><div class="menu spaced"><button onclick="go('recipes')"><span>📚</span>食谱库</button><button onclick="go('breakfast')"><span>🥪</span>快手早餐</button><button onclick="go('prep')"><span>🥣</span>周末备餐</button></div><div class="notice spaced">饮食禁忌：不吃海鲜、香菜、芹菜；喜欢鸡胸肉和辣。示例菜谱可按喜好替换。</div>`)}function coffee(){if(data.expenses.some(x=>x.name==='瑞幸精萃澳瑞白'&&x.date===today())){alert('今天已经记录过澳白啦 ☕');return;}data.expenses.push({id:Date.now(),name:'瑞幸精萃澳瑞白',amount:Number(data.settings.coffeePrice)||15.77,date:today(),type:'咖啡饮品'});save();alert('已记录咖啡及支出');render()}function recipes(){return header('食谱库','可在周末预制，也可工作日快速组合')+dishes.map(x=>card(`<div class="row"><div class="imagebox">${x[0]}</div><div class="grow"><b>${x[1]}</b><p class="small muted">${x[2]}</p></div></div>`)).join('')+card(`<div class="notice">菜谱是初步示例。熟食及时冷藏，3–4天内食用；后半周餐份建议及时冷冻，复热时确保中心热透。</div>`)}function breakfast(){return header('快手早餐','早上优先照顾狗狗，不强制做饭')+card(`<b>默认早餐</b>${row('罗森肉包 + 热豆浆','可按饥饿程度补充鸡蛋或水果','','🥟')}`)+dishes.slice(0,3).map(x=>card(row(x[1],x[2]+' · 提前做熟，早上复热','','🥪'))).join('')}
function prep(){return header('周末备餐','MEAL PREP · 周六或周日灵活安排')+card(`<b>本周备餐进度</b><div class="small muted spaced">${data.prep.filter(Boolean).length}/4 已完成</div><div class="progress spaced"><div style="width:${data.prep.filter(Boolean).length*25}%"></div></div>${['确定下周食谱（3–4天为一批）','检查库存并整理采购清单','采购食材（小象超市 / 盒马）','集中烹饪、分装、冷冻并标注日期'].map((x,i)=>`<div class="row"><input class="check" type="checkbox" ${data.prep[i]?'checked':''} onchange="data.prep[${i}]=this.checked;save();render()"><div class="grow">${x}</div></div>`).join('')}`)+card(`<b>备餐安排</b><div class="notice spaced">周末有少量接单时：上午优先训练，下午采购或备餐；赶稿则可将备餐缩减为1–2种主菜，其他餐用外卖替换。</div><div class="menu spaced"><button onclick="go('recipes')"><span>🍱</span>食谱</button><button onclick="go('groceries')"><span>🛒</span>采购</button><button onclick="go('preplog')"><span>📋</span>记录</button></div>`)}function groceries(){let total=data.groceries.reduce((a,x)=>a+x.price*x.qty,0);return header('采购清单','参考估价 · 实际以小象超市/盒马结算为准')+card(`<div class="chipset">${['小象超市','盒马'].map(x=>`<button class="pill ${data.settings.store===x?'active':''}" onclick="data.settings.store='${x}';save();render()">${x}</button>`).join('')}</div>${data.groceries.map(x=>`<div class="row"><input class="check" type="checkbox" ${x.checked?'checked':''} onchange="let g=data.groceries.find(g=>g.id===${x.id});g.checked=this.checked;save();render()"><div class="grow"><b>${esc(x.name)}</b><div class="small muted">${x.qty} ${esc(x.unit)} × ¥${x.price.toFixed(2)}</div></div><b>¥${(x.qty*x.price).toFixed(2)}</b><button class="pill" onclick="editGrocery(${x.id})">编辑</button></div>`).join('')}<div class="line spaced"><b>参考总额</b><b class="money">¥${total.toFixed(2)}</b></div><p class="small muted">价格为演示估算，不是商家实时商品报价；部分商品规格与计价方式需要下单时核实。</p><div class="grid">${btn('＋ 添加食材','addGrocery()')}${btn('复制采购清单','copyGroceries()')}</div>`)}function addGrocery(){let name=prompt('食材名称');if(!name)return;let qty=Number(prompt('数量','1'))||1,price=Number(prompt('每单位估价（元）','10'))||0;data.groceries.push({id:Date.now(),name,qty,unit:'份',price,checked:false});save();render()}function editGrocery(id){let x=data.groceries.find(x=>x.id===id);let q=prompt('数量',x.qty);if(q===null)return;let p=prompt('每单位参考价（元）',x.price);if(p===null)return;x.qty=Number(q)||0;x.price=Number(p)||0;save();render()}async function copyText(s){try{await navigator.clipboard.writeText(s);alert('已复制')}catch(e){prompt('复制以下内容',s)}}function copyGroceries(){copyText(data.groceries.map(x=>`${x.checked?'✓':'□'} ${x.name} ${x.qty}${x.unit} 约¥${(x.qty*x.price).toFixed(2)}`).join('\n'))}function preplog(){return header('备餐记录','一只饭盒循环使用，家中按份冷冻')+card(`<b>备餐检查</b>${['熟食及时分装','未来几天的餐冷藏，其余冷冻','贴上制作日期标签','次日餐提前冷藏解冻','上班带饭保持低温，到公司冷藏'].map(x=>row(x,'','','✓')).join('')}<div class="notice">此页是操作清单，不是食品安全温度检测。复热须彻底加热，冷冻餐不能长期室温解冻。</div>`)}
function diary(){let d=data.diaries[today()]||{mood:'一般',text:''};return header('今日日记','文字 + 心情 · 私人记录')+card(`<b>${today()} · 今天过得怎么样？</b><div class="chipset">${['开心','不错','一般','疲惫','难过'].map(x=>`<button class="pill ${d.mood===x?'active':''}" onclick="setMood('${x}')">${x}</button>`).join('')}</div><textarea id="diaryText" class="field textarea" placeholder="今天发生了什么？">${esc(d.text)}</textarea><div class="spaced">${btn('保存今日日记','saveDiary()')}</div>`)+card(`<b>历史日记</b>${Object.keys(data.diaries).sort().reverse().map(k=>row(k+' · '+data.diaries[k].mood,data.diaries[k].text.slice(0,80),`openDiary('${k}')`,'📖')).join('')||'<div class="empty">还没有记录</div>'}`)}function setMood(m){let d=data.diaries[today()]||{text:''};const field=$('#diaryText');if(field)d.text=field.value;d.mood=m;data.diaries[today()]=d;save();render()}function saveDiary(){data.diaries[today()]={mood:(data.diaries[today()]||{}).mood||'一般',text:$('#diaryText').value};if(!data.diaryXpDates)data.diaryXpDates=[];if(!data.diaryXpDates.includes(today())){data.xp+=5;data.diaryXpDates.push(today())}save();alert('日记已保存');render()}function openDiary(k){alert(k+'\n\n'+data.diaries[k].mood+'\n'+data.diaries[k].text)}
function work(){return header('接单工作','WORK · 周末稿件优先级管理')+card(`<div class="titleline"><b>接单项目</b><span class="tag">${data.jobs.length} 项</span></div>${data.jobs.map(x=>`<div class="row"><input type="checkbox" class="check" ${x.done?'checked':''} onchange="data.jobs.find(j=>j.id===${x.id}).done=this.checked;save();render()"><div class="grow"><b>${esc(x.name)}</b><div class="small muted">截止 ${esc(x.deadline)} · 预计${esc(x.hours)}小时</div></div></div>`).join('')||'<div class="empty">暂无接单项目</div>'}${btn('＋ 新增接单','addJob()')}`)+card(`<b>排程规则</b><p class="small muted">周末少量接单时，优先保留交稿时间；健身安排在周末上午，备餐与采购可互换日期。赶稿周允许减少非必要任务。</p>`)}function addJob(){let name=prompt('项目名称');if(!name)return;let deadline=prompt('截止日期（例如 11月29日）','本周日')||'',hours=prompt('预计需要几小时','3')||'3';data.jobs.push({id:Date.now(),name,deadline,hours,done:false});save();render()}
function review(){let t=data.tasks.find(x=>x.id===activeTask)||data.tasks.find(x=>!x.done)||data.tasks[0];return header('任务回顾','未完成可以备注，不扣经验值')+card(`<b>任务：${esc(t.name)}</b><div class="chipset">${['临时赶稿','身体疲劳','时间冲突','情绪不好','其他'].map(x=>`<button class="pill ${sub===x?'active':''}" onclick="sub='${x}';render()">${x}</button>`).join('')}</div><textarea id="reasonText" class="field textarea" placeholder="记录未完成的原因，例如临时接稿、遛狗时间延长……">${esc(data.notes[t.id]||'')}</textarea><div class="spaced">${btn('保存备注','saveNote('+t.id+')')}</div><div class="spaced">${btn('✦ 复制分析内容并打开 GPT','sendGPT('+t.id+')')}</div><p class="small muted">一键复制任务背景后打开 ChatGPT，在聊天中粘贴发送即可；GPT 的回复不会自动回写网站。</p>`)+card(`<b>本周调整原则</b><div class="notice">工作冲突→优先改期；疲劳→缩短或休息；遛狗已消耗较多体力→不强制补偿训练；长期重复失败→重新调整固定时间。</div>`)}function saveNote(id){data.notes[id]=$('#reasonText').value;data.reviews.push({date:today(),task:id,reason:sub,note:data.notes[id]});save();alert('备注已保存')}async function sendGPT(id){let t=data.tasks.find(x=>x.id===id);let note=$('#reasonText').value;data.notes[id]=note;data.reviews.push({date:today(),task:id,reason:sub,note});save();let promptText=`你是我的PoPoDay私人生活教练。请分析本周未完成任务「${t.name}」，原因标签「${sub||'未选择'}」，备注「${note||'无'}」。我10:00-19:00上班，通勤单程30-60分钟，晚上遛狗1-2小时，周末可能少量接稿，偏好周末上午健身。请给出本周可行的调整、是否改期/缩短/跳过，以及一条可复制回任务管理器的建议。不要惩罚性补做。`;await copyText(promptText);window.open('https://chatgpt.com/','_blank','noopener')}
function growth(){return header('成长','GROWTH · 记录长期变化')+card(`<div class="line"><div><b>Lv.${Math.floor(data.xp/200)+1}</b><p class="small muted">${data.xp%200}/200 XP</p></div><span class="mascot">🐕‍🦺 🐈‍⬛</span></div><div class="progress"><div style="width:${data.xp%200/2}%"></div></div>`)+card(`<div class="grid">${[['已完成任务',doneCount()],['训练记录',data.workouts.length],['日记篇数',Object.keys(data.diaries).length],['反馈记录',data.reviews.length]].map(x=>`<div class="metric"><b>${x[1]}</b><div class="small muted">${x[0]}</div></div>`).join('')}</div>`)+card(`<b>成长规则</b><p class="small muted">只奖励可持续的行动，不以体重、限制饮食或连续打卡作为惩罚条件。中断后随时可以重新开始。</p>`)}function finance(){let sum=data.expenses.reduce((a,x)=>a+x.amount,0);return header('财务','FINANCE · 记录消费与储蓄')+card(`<div class="small muted">累计记录支出</div><div class="h">¥${sum.toFixed(2)}</div>${data.expenses.slice().reverse().map(x=>row(x.name,x.date+' · '+x.type,'','¥'+x.amount.toFixed(2))).join('')||'<div class="empty">还没有消费记录</div>'}<div class="spaced">${btn('＋ 记录支出','addExpense()')}</div>`)+card(`<b>咖啡消费</b><p class="small muted">你的瑞幸精萃澳瑞白：热、大杯、意式拼配、燕麦奶、不另外加糖；截图到手价 ¥15.77（实际价格可能变化）。</p>`)}function addExpense(){let name=prompt('支出项目');if(!name)return;let amount=Number(prompt('金额（元）','0'));if(!Number.isFinite(amount)||amount<0)return;data.expenses.push({id:Date.now(),name,amount,date:today(),type:'生活日用'});save();render()}
function profile(){return header('我的','PROFILE · 设置与数据备份')+card(`<div class="line"><div><b>PoPo</b><div class="small muted">个人生活记录 · Lv.${Math.floor(data.xp/200)+1}</div></div><span class="mascot">🐕‍🦺 🐈‍⬛</span></div>`)+card(`<b>数据安全</b><p class="small muted">目前所有数据只保存在本浏览器，不会自动同步到其他手机。清除浏览器数据可能导致记录丢失，请定期导出并保存到手机文件或云盘。</p><div class="spaced">${btn('⬇ 导出完整备份','exportData()')}</div><div class="spaced"><label class="secondary full" style="display:block;text-align:center">⬆ 导入备份<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div><div class="small muted spaced">上次导出：${esc(data.lastBackup||'尚未导出')}</div>`)+card(`<b>偏好</b><p class="small muted">不吃海鲜、香菜、芹菜；喜欢鸡胸肉和辣。每周3次训练，周末上午优先；晚上遛狗1–2小时。</p><div class="row"><div class="grow">咖啡记录参考单价</div><button class="pill" onclick="editCoffee()">¥${data.settings.coffeePrice}</button></div>`)+card(`<b>PoPoDay V1 · 说明</b><p class="small muted">这是可操作的本地原型。当前未接入商家实时价格、在线账号、云同步或自动 GPT API。建议先试用一周并反馈，再升级。</p>`)}function editCoffee(){let p=Number(prompt('输入当前澳白到手价',data.settings.coffeePrice));if(p>0){data.settings.coffeePrice=p;save();render()}}function exportData(){data.lastBackup=today();save();let blob=new Blob([JSON.stringify({app:'PoPoDay',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='PoPoDay-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);render()}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data||!Array.isArray(x.data.tasks))throw Error('格式不匹配');if(!confirm('导入将覆盖当前数据，确定吗？'))return;data=x.data;for(let k in seed)if(data[k]===undefined)data[k]=clone(seed[k]);save();render();alert('恢复成功')}catch(e){alert('导入失败：'+e.message)}};r.readAsText(f)}
const names={home:'首页',plan:'计划',training:'训练',nutrition:'饮食',profile:'我的'};function render(){let views={home,plan,training,nutrition,prep,groceries,preplog,recipes,breakfast,diary,work,review,growth,finance,profile};$('#app').innerHTML=(views[page]||home)();$('#nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><i>${({home:'⌂',plan:'▦',training:'♧',nutrition:'♨',profile:'◉'})[k]}</i>${v}</button>`).join('')}try{render()}catch(e){console.error(e);document.getElementById('app').insertAdjacentHTML('afterbegin','<section class="card">交互加载失败，请使用 Safari 打开部署后的网站。</section>')}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
